<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Pants On My Head</title>
<style>
  /* Same paper, ink and sage as Grub (grub/css/site.css). System fonts only. */
  :root {
    --paper: #f4f2ef;
    --line: #e1d9cc;
    --ink: #434343;
    --ink-soft: #666c68;
    --head: #2f4a3d;
    --accent: #3f6453;
    --serif: "Iowan Old Style", Charter, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #25302b;
      --line: #42514a;
      --ink: #ece6db;
      --ink-soft: #b3bdb6;
      --head: #e1d9cc;
      --accent: #a9c4b6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.6 var(--sans);
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 72px) 24px calc(env(safe-area-inset-bottom) + 64px);
  }
  h1 {
    font: 600 44px/1.05 var(--serif);
    color: var(--head);
    margin: 0 0 12px;
  }
  .intro { color: var(--ink-soft); margin: 0 0 48px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 16px;
    padding: 26px 0;
    color: inherit;
    text-decoration: none;
  }
  .name { font: 600 30px/1.15 var(--serif); color: var(--head); }
  .what { grid-column: 1; color: var(--ink-soft); }
  .go {
    grid-row: 1 / span 2;
    grid-column: 2;
    font-size: 26px;
    color: var(--accent);
    transition: transform 0.15s ease;
  }
  a:hover .name, a:focus-visible .name { color: var(--accent); }
  a:hover .go, a:focus-visible .go { transform: translateX(4px); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Pants On My Head</h1>
  <p class="intro">A couple of small things I made.</p>
  <ul>
    <li>
      <a href="grub/">
        <span class="name">Grub</span>
        <span class="what">My recipes, with shopping lists and cook planning.</span>
        <span class="go" aria-hidden="true">&rarr;</span>
      </a>
    </li>
    <li>
      <a href="taper/">
        <span class="name">Taper</span>
        <span class="what">A bad habit tracker for doing bad things less.</span>
        <span class="go" aria-hidden="true">&rarr;</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
